# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embed-api
  labels:
    app.kubernetes.io/name: embed-api
spec:
  replicas: 1
  strategy:
    type: Recreate          # see 4d — do NOT set this yet if you want to see the failure
  selector:
    matchLabels:
      app.kubernetes.io/name: embed-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embed-api
    spec:
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: embed-api:0.1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REQUIRE_GPU
              value: "1"
            - name: OTEL_SERVICE_NAME
              value: embedvisual
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability:4318"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3