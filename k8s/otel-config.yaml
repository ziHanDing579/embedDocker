# k8s/otel-collector-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.container.name
        pod_association:
          - sources:
              - from: connection

      resource:
        attributes:
          - key: deployment.environment
            value: k3s-local
            action: upsert

      batch:
        timeout: 5s

    exporters:
      debug:
        verbosity: detailed
      otlphttp/grafana:
        endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
        auth:
          authenticator: basicauth/grafana

    extensions:
      basicauth/grafana:
        client_auth:
          username: ${env:GRAFANA_INSTANCE_ID}
          password: ${env:GRAFANA_OTLP_TOKEN}
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [basicauth/grafana, health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes, resource, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [k8sattributes, resource, batch]
          exporters: [debug]