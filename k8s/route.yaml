# k8s/httproute-api.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: embed-api
  namespace: default
spec:
  parentRefs:
    - name: edge
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /embed
      backendRefs:
        - name: embed-api
          port: 80